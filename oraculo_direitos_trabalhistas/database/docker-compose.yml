# Sobe o PostgreSQL com pgvector e executa os scripts na primeira inicialização.
# Uso:  docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: oraculo-db
    environment:
      POSTGRES_DB: oraculo
      POSTGRES_USER: oraculo
      POSTGRES_PASSWORD: oraculo_dev   # somente para desenvolvimento
    ports:
      - "5432:5432"
    volumes:
      - ./01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - oraculo_data:/var/lib/postgresql/data

volumes:
  oraculo_data:
